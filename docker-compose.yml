# ---------------------------------------------------------------------------
#  Sistema de Foros en Linea (CuboClub) - despliegue en Docker Cloud
#
#  Levanta los cuatro componentes desde las imagenes publicadas en Docker Hub:
#    foro-web          :80    Angular + nginx (independiente del backend)
#    foro-usuarios     :8081  cuentas, roles, login (emite el JWT)
#    foro-temas        :8082  categorias, temas, comentarios
#    foro-moderacion   :8083  normas, reportes, sanciones
#
#  Requisitos en la maquina (Play with Docker u otra):
#    - archivo .env  (copiar .env.example y completar)
#    - carpeta wallet/ con el Wallet de Oracle descomprimido (solo para PERFIL=oracle)
#
#    docker compose up -d
#    docker compose ps
#    docker compose logs -f foro-moderacion
#
#  Para construir las imagenes desde el codigo en vez de bajarlas:
#    docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# ---------------------------------------------------------------------------

x-backend: &backend
  restart: unless-stopped
  environment: &entorno
    SPRING_PROFILES_ACTIVE: ${PERFIL:-oracle}
    ORACLE_JDBC_URL: jdbc:oracle:thin:@${TNS_ALIAS:-fullstack3_tp}?TNS_ADMIN=/opt/oracle/wallet
    ORACLE_USER: ${ORACLE_USER:-FORO}
    ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
    FORO_JWT_SECRETO: ${FORO_JWT_SECRETO:?Define FORO_JWT_SECRETO en .env}
    FORO_CORS_ORIGENES: ${FORO_CORS_ORIGENES:-http://localhost:*}
    JAVA_OPTS: -XX:MaxRAMPercentage=60
  volumes:
    # El Wallet nunca va dentro de la imagen: se monta en solo lectura.
    - ./wallet:/opt/oracle/wallet:ro
  mem_limit: 512m

services:
  foro-usuarios:
    <<: *backend
    image: ${DOCKERHUB_USUARIO:?Define DOCKERHUB_USUARIO en .env}/foro-usuarios:${VERSION_USUARIOS:-2.0.0}
    container_name: foro-usuarios
    ports:
      - "8081:8081"

  foro-temas:
    <<: *backend
    image: ${DOCKERHUB_USUARIO}/foro-temas:${VERSION_TEMAS:-2.0.0}
    container_name: foro-temas
    ports:
      - "8082:8082"

  foro-moderacion:
    <<: *backend
    image: ${DOCKERHUB_USUARIO}/foro-moderacion:${VERSION_MODERACION:-1.0.1}
    container_name: foro-moderacion
    environment:
      <<: *entorno
      # Dentro de la red de compose, foro-temas se alcanza por su nombre.
      FORO_TEMAS_URL: http://foro-temas:8082
    ports:
      - "8083:8083"
    depends_on:
      - foro-temas

  foro-web:
    image: ${DOCKERHUB_USUARIO}/foro-web:${VERSION_WEB:-1.0.1}
    container_name: foro-web
    restart: unless-stopped
    ports:
      - "80:80"
    mem_limit: 64m
