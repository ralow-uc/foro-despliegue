# ---------------------------------------------------------------------------
#  Sistema de Foros en Linea (CuboClub) - ejecucion local con Docker Compose
#
#  El despliegue en la nube es en Render (render.yaml). Este archivo levanta
#  los mismos cuatro contenedores en el computador, construidos desde el codigo
#  con los repositorios clonados uno al lado del otro:
#    foro-web          :80    Angular + nginx (independiente del backend)
#    foro-usuarios     :8081  cuentas, roles, login (emite el JWT)
#    foro-temas        :8082  categorias, temas, comentarios
#    foro-moderacion   :8083  normas, reportes, sanciones
#
#  Requisitos:
#    - archivo .env  (copiar .env.example y completar)
#    - carpeta wallet/ con el Wallet de Oracle descomprimido (solo PERFIL=oracle)
#
#    docker compose up -d --build
#    docker compose ps
#    docker compose logs -f foro-moderacion
# ---------------------------------------------------------------------------

x-backend: &backend
  restart: unless-stopped
  environment: &entorno
    SPRING_PROFILES_ACTIVE: ${PERFIL:-oracle}
    ORACLE_JDBC_URL: jdbc:oracle:thin:@${TNS_ALIAS:-fullstack3_tp}?TNS_ADMIN=/opt/oracle/wallet
    ORACLE_USER: ${ORACLE_USER:-FORO}
    ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
    FORO_JWT_SECRETO: ${FORO_JWT_SECRETO:?Define FORO_JWT_SECRETO en .env}
    FORO_CORS_ORIGENES: ${FORO_CORS_ORIGENES:-http://localhost:*}
    JAVA_OPTS: -XX:MaxRAMPercentage=60
  volumes:
    # El Wallet nunca va dentro de la imagen: se monta en solo lectura.
    - ./wallet:/opt/oracle/wallet:ro
  mem_limit: 512m

services:
  foro-usuarios:
    <<: *backend
    build: ../foro-usuarios
    image: foro-usuarios:2.0.0
    container_name: foro-usuarios
    ports:
      - "8081:8081"

  foro-temas:
    <<: *backend
    build: ../foro-temas
    image: foro-temas:2.0.0
    container_name: foro-temas
    ports:
      - "8082:8082"

  foro-moderacion:
    <<: *backend
    build: ../foro-moderacion
    image: foro-moderacion:1.0.1
    container_name: foro-moderacion
    environment:
      <<: *entorno
      # Dentro de la red de compose, foro-temas se alcanza por su nombre.
      FORO_TEMAS_URL: http://foro-temas:8082
    ports:
      - "8083:8083"
    depends_on:
      - foro-temas

  foro-web:
    build: ../foro-web
    image: foro-web:1.0.1
    container_name: foro-web
    restart: unless-stopped
    ports:
      - "80:80"
    mem_limit: 64m
